spring.application.name=algamoney
spring.jpa.database=MYSQL
spring.datasource.url=jdbc:mysql://localhost/algamoneyapi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.show-sql=true

spring.jackson.deserialization.fail-on-unknown-properties=true

# Resource Server: valida tokens JWT emitidos pelo Authorization Server local
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000