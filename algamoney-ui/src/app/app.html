<div class="container">
  <div class="grid">
    <div class="col-12">
      <h1>Lançamentos</h1>
    </div>

    <div class="col-12">
      <label>Descrição</label>
      <input pInputText type="text" class="w-full" />
    </div>

    <div class="col-12">
      <label style="display: block">Vencimento</label>
      <input pInputText type="text" style="width: 95px" />

      <label style="margin: 5px">Até</label>
      <input pInputText type="text" style="width: 95px" />
    </div>

    <div class="col-12">
      <button pButton type="submit" severity="secondary" label="Pesquisar"></button>
    </div>
  </div>
  <div class="grid">
    <div class="col-12">
      <p-table [value]="lancamentos" [paginator]="true" [rows]="2" >
        <ng-template pTemplate="header">
          <tr>
            <th>Pessoa</th>
            <th>Descrição</th>
            <th class="col-data-header">Vencimento</th>
            <th class="col-data-header">Pagamento</th>
            <th class="col-valor-header">Valor</th>
            <th class="col-acoes-header">Ações</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-lancamento>
          <tr>
            <td>{{ lancamento.pessoa }}</td>
            <td>{{ lancamento.descricao }}</td>
            <td class="col-data-content">{{ lancamento.dataVencimento }}</td>
            <td class="col-data-content">{{ lancamento.dataPagamento }}</td>
            <td>
              <span [style.color]="lancamento.tipo === 'DESPESA' ? 'red' : 'blue'"
                >{{ lancamento.valor }}
              </span>
            </td>
            <td class="col-acoes">
              <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
              <button pButton icon="pi pi-trash"  pTooltip="Excluir" tooltipPosition="top"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      <div>
        <a pButton label="Lançamento"></a>
      </div>
    </div>
  </div>
</div>
