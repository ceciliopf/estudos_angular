<div class="container">
  <div class="grid">
    <form autocomplete="off" (ngSubmit)="pesquisar()" class="p-fluid">
      <div class="col-12">
        <h1>Pessoas</h1>
      </div>

      <div class="col-12">
        <label>Nome</label>
        <input pInputText type="text" class="w-full" name="nome" [(ngModel)]="filtro.nome" />
      </div>

      <div class="col-12">
        <button pButton type="submit" severity="secondary" label="Pesquisar"></button>
      </div>
    </form>
  </div>
  <div class="grid">
    <div class="col-12">
      <p-table [value]="pessoas" [paginator]="true" [rows]="filtro.itensPorPagina" 
        [lazy]="true" [totalRecords]="totalRegistros" (onLazyLoad)="aoMudarPagina($event)"
        responsiveLayout="stack">
        <ng-template pTemplate="header">
          <tr>
            <th>Nome</th>
            <th>Cidade</th>
            <th>Estado</th>
            <th>Status</th>
            <th class="col-acoes-header"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-pessoa>
          <tr>
            <td>
              <span class="p-column-title">Nome</span>
              {{ pessoa.nome }}
            </td>
            <td>
              <span class="p-column-title">Cidade</span>
              {{ pessoa.cidade }}
            </td>
            <td>
              <span class="p-column-title">Estado</span>
              {{ pessoa.estado }}
            </td>
            <td>
              <span class="p-column-title">Status</span>
              <a href="javascript:;" [pTooltip]="pessoa.ativo ? 'Desativar' : 'Ativar'" tooltipPosition="top" [style.color]="pessoa.ativo ? 'blue' : 'red'" style="text-decoration: none;" (click)="alternarStatus(pessoa)">
                {{ pessoa.ativo ? 'Ativo' : 'Inativo' }}
              </a>
            </td>
            <td class="col-acoes">
              <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
              <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top" (click)="excluir(pessoa)"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      <div>
        <a pButton label="Nova Pessoa"></a>
      </div>
    </div>
  </div>
</div>
<p-toast></p-toast>
<p-confirmDialog header="Confirmação" icon="pi pi-exclamation-triangle" appendTo="body" acceptLabel="Sim" rejectLabel="Não" styleClass="dialog-botoes-invertidos">
</p-confirmDialog>
